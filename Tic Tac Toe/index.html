<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>

    <!-- bootstrap css  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- main css  -->
    <link rel="stylesheet" href="style.css" type="text/css">
</head>

<body>

    <header>
        <!-- navbar section  -->
        <section class="navbar py-5">
            <div class="container">
                <div class="navbar-title">
                    <h2 class="fs-2">Tic Tac Toe</h2>
                </div>
            </div>
        </section>
    </header>

    <main>

        <!-- tic toe section input  -->
        <section id="inputFields" class="input py-5">
            <div class="container">
                <div class="input-content">
                    <form onsubmit="onFormSubmit(event)" class="d-flex justify-content-center align-items-end">
                        <div class="mx-2">
                            <label class="form-label">Player 1</label>
                            <input type="text" class="form-control bg-transparent text-light shadow-none" id="player1"
                                required>
                        </div>

                        <div class="mx-2">
                            <label class="form-label">Player 2</label>
                            <input type="text" class="form-control bg-transparent text-light shadow-none" id="player2"
                                required>
                        </div>

                        <div class="mx-2">
                            <button type="submit" class="btn btn-primary px-4">Start</button>
                        </div>
                    </form>
                </div>
            </div>
        </section>

        <!-- tic tac toe section  -->
        <section id="displayBoard" class="board py-5 vw-100">
            <div class="container">
                <div class="board-content d-flex justify-content-center align-items-center">
                    <div>
                        <div id="box1" class="box"></div>
                        <div id="box2" class="box"></div>
                        <div id="box3" class="box"></div>
                    </div>
                    <div>
                        <div id="box4" class="box"></div>
                        <div id="box5" class="box"></div>
                        <div id="box6" class="box"></div>
                    </div>
                    <div>
                        <div id="box7" class="box"></div>
                        <div id="box8" class="box"></div>
                        <div id="box9" class="box"></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- section display player name and score  -->
        <section id="playerNameScore" class="player-name-score">
            <div class="container">
                <div class="player-content">
                    <h2 id="player1Details"></h2>
                    <h2 id="player2Details"></h2>
                </div>
            </div>
        </section>
    </main>

    <footer></footer>

    <!-- bootstrap cdn  -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- main script  -->
    <script src="script.js" type="text/javascript"></script>
</body>

</html>
