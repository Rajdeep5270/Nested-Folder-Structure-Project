<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Folder App</title>

    <!-- remix icons  -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />

    <!-- bootstrap css  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- main css  -->
    <link rel="stylesheet" href="style.css" type="text/css">
</head>

<body>

    <main>
        <!-- sidebar section  -->
        <section class="sidebar d-flex align-items-center flex-column">
            <div class="siderbar-title py-5">
                <h2>Sidebar</h2>
            </div>

            <div class="folder-title pb-5 d-flex">
                <h4>Folder Structure</h4>
            </div>

            <div class="sidebar-content" id="mainParent">

            </div>

            <div class="add-folder-btn">
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">Add
                    Folder</button>
            </div>
        </section>


        <!-- model  -->
        <section class="modal" id="exampleModal">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Folder Name</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <input type="text" placeholder="e.g. Python" id="folderName"
                            class="form-control shadow-none mb-5" required>
                        <button type="submit" data-bs-dismiss="modal" class="btn btn-primary float-end" id="addBtn">Add
                            Folder</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- bootstrap cdn  -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <!-- main script  -->
    <script src="script.js" type="text/javascript"></script>
</body>

</html>
